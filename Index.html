<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F4F3EE;--card:#fff;--tx:#1f1e1b;--tx2:#6b6a64;--tx3:#9a9890;--bd:#e3e1d9;--bd2:#cfccc2;
--g:#3B6D11;--gbg:#EAF3DE;--r:#A32D2D;--rbg:#FCEBEB;--b:#185FA5;--bbg:#E6F1FB;--a:#854F0B;--abg:#FAEEDA;--p:#534AB7;--pbg:#EEEDFE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:20px;font-weight:600;margin:4px 0 12px}
h2{font-size:16px;font-weight:600;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.lb{font-size:12px;color:var(--tx2);margin:0 0 6px}
.big{font-size:26px;font-weight:600;margin:0}
.mid{font-size:18px;font-weight:600;margin:0}
.muted{color:var(--tx2)}.small{font-size:13px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.b{color:var(--b)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:10px;padding:10px;background:#F1EFE8}
.tile.g{background:var(--gbg)}.tile.r{background:var(--rbg)}
.bar{height:9px;border-radius:5px;background:#ECEAE3;overflow:hidden;margin:6px 0}
.bar>div{height:100%;border-radius:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.row .t{flex:1;min-width:0}
.row .t p{margin:0}
.tap{cursor:pointer}
.sel{background:var(--bbg);border-radius:10px;padding-left:8px;padding-right:8px;color:var(--b)}
.chip{display:inline-block;padding:7px 12px;border:1px solid var(--bd2);border-radius:18px;margin:0 6px 8px 0;font-size:14px;background:#fff;cursor:pointer}
.chip.on{background:var(--bbg);color:var(--b);border-color:#85B7EB;font-weight:600}
.seg{display:grid;border:1px solid var(--bd2);border-radius:10px;overflow:hidden;margin-bottom:12px;background:#fff}
.seg.two{grid-template-columns:1fr 1fr}.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg div{padding:10px 4px;text-align:center;cursor:pointer;font-size:14px}
.seg .on{background:var(--bbg);color:var(--b);font-weight:600}
.seg .on.g{background:var(--gbg);color:var(--g)}.seg .on.r{background:var(--rbg);color:var(--r)}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--bd2);border-radius:10px;background:#fff;color:var(--tx);margin-bottom:12px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #85B7EB;border-color:#85B7EB}
.monto{font-size:30px;font-weight:600;text-align:center}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd2);background:#fff;font-size:16px;font-weight:600;text-align:center;cursor:pointer;color:var(--tx);margin-bottom:10px}
.btn.pri{background:#1f1e1b;color:#fff;border-color:#1f1e1b}
.btn.gr{background:#3B6D11;color:#fff;border-color:#3B6D11}
.btn.rd{background:#A32D2D;color:#fff;border-color:#A32D2D}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0 6px 6px 0}
.btn[disabled]{opacity:.6}
.err{color:var(--r);font-size:14px;margin:0 0 10px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.bd-g{background:var(--gbg);color:var(--g)}.bd-r{background:var(--rbg);color:var(--r)}.bd-a{background:var(--abg);color:var(--a)}
.bd-b{background:var(--bbg);color:var(--b)}.bd-p{background:var(--pbg);color:var(--p)}.bd-n{background:#F1EFE8;color:#5F5E5A}
.day{width:34px;height:34px;border-radius:9px;background:#F1EFE8;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-size:17px}
.mnav i{font-size:22px;padding:6px 10px;cursor:pointer}
.strike{text-decoration:line-through;color:var(--tx3)}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav div{flex:1;text-align:center;font-size:11px;color:var(--tx2);cursor:pointer}
#nav div i{display:block;font-size:22px}
#nav div.on{color:var(--b);font-weight:600}
#nav .plus i{background:#1f1e1b;color:#fff;border-radius:50%;width:46px;height:46px;line-height:46px;margin:-14px auto 0;font-size:26px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#1f1e1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90%}
#toast.e{background:#A32D2D}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal .sheet{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:85vh;overflow:auto}
.loading{text-align:center;color:var(--tx2);padding:60px 0}
.center{text-align:center}
a{color:var(--b)}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
// ============ Estado y utilidades ============
const S = { u: null, init: null, mes: null, view: 'inicio', param: null };
let F = {};          // formulario actual
let busy = false;

const $ = s => document.querySelector(s);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'S/ ' + Number(n || 0).toLocaleString('es-PE', { maximumFractionDigits: 2 });
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const auth = () => ({ id: S.u.id, pin: S.u.pin });
const isAdmin = () => S.u && S.u.rol === 'admin';
const pct = (a, b) => b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0;
const msg = e => String((e && e.message) || e).replace(/^(Exception|Error|ScriptError):\s*/i, '');

function api(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
const store = {
  get() { try { return JSON.parse(localStorage.getItem('consultorio_u') || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem('consultorio_u', JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem('consultorio_u'); } catch (e) {} }
};
function toast(t, err) {
  const el = $('#toast'); el.textContent = t; el.className = err ? 'e' : ''; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 3000);
}
function modal(html) { $('#sheet').innerHTML = html; $('#modal').style.display = 'flex'; }
function closeModal() { $('#modal').style.display = 'none'; }
function loading() { $('#app').innerHTML = '<div class="loading">Cargando…</div>'; }
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nombreMes(m) {
  const [y, mo] = m.split('-').map(Number);
  const t = new Date(y, mo - 1, 1).toLocaleDateString('es-PE', { month: 'long', year: 'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function mover(m, d) { let [y, mo] = m.split('-').map(Number); mo += d; if (mo < 1) { mo = 12; y--; } if (mo > 12) { mo = 1; y++; } return y + '-' + String(mo).padStart(2, '0'); }
function mnav() {
  return `<div class="mnav"><i class="ti ti-chevron-left" onclick="cambiaMes(-1)"></i><b>${esc(nombreMes(S.mes))}</b>
  <i class="ti ti-chevron-right" onclick="cambiaMes(1)" style="${S.mes >= S.init.mes ? 'visibility:hidden' : ''}"></i></div>`;
}
function cambiaMes(d) { const m = mover(S.mes, d); if (m > S.init.mes) return; S.mes = m; go(S.view, S.param); }
function bar(p, color) { return `<div class="bar"><div style="width:${p}%;background:${color}"></div></div>`; }
function colorPct(p) { return p >= 100 ? '#E24B4A' : p >= 80 ? '#BA7517' : '#639922'; }
function wa(cel, texto) {
  let n = String(cel || '').replace(/[^\d+]/g, '');
  n = n.charAt(0) === '+' ? n.slice(1) : '51' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto || '');
}
function chip(txt, on, fn) { return `<span class="chip ${on ? 'on' : ''}" onclick="${fn}">${esc(txt)}</span>`; }
function seg(opts, cls) {
  return `<div class="seg ${opts.length === 3 ? 'three' : 'two'}">` + opts.map(o => `<div class="${o.on ? 'on ' + (o.c || '') : ''}" onclick="${o.fn}">${esc(o.t)}</div>`).join('') + '</div>';
}
async function refreshInit() { S.init = await api('init', auth()); }

// ============ Inicio de sesión ============
async function start() {
  const saved = store.get();
  if (saved) {
    S.u = saved;
    try { await refreshInit(); S.u.rol = S.init.user.rol; S.mes = S.init.mes; showNav(); go('inicio'); return; }
    catch (e) { store.clear(); }
  }
  showLogin();
}
async function showLogin() {
  $('#nav').style.display = 'none';
  loading();
  let us = [];
  try { us = await api('usuarios'); } catch (e) { $('#app').innerHTML = `<p class="err">${esc(msg(e))}</p>`; return; }
  F = { uid: '', pin: '', err: '' };
  $('#app').innerHTML = `<div style="padding-top:40px"><h1 class="center">Finanzas del consultorio</h1>
  <p class="center muted small">Dr. Daniel Villamizar Hernández</p>
  <div class="card"><p class="lb">¿Quién eres?</p>
  ${us.map(u => `<span class="chip" data-u="${esc(u.id)}" onclick="F.uid='${esc(u.id)}';document.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('on',x.dataset.u===F.uid))">${esc(u.nombre)}</span>`).join('')}
  <p class="lb" style="margin-top:8px">Tu PIN de 6 dígitos</p>
  <input type="password" inputmode="numeric" maxlength="6" id="pin" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
  <label style="display:flex;align-items:center;gap:8px;margin:-2px 0 12px;cursor:pointer"><input type="checkbox" id="recordar" checked style="width:20px;height:20px;margin:0"> Recordarme en este celular</label>
  <p class="err" id="lerr"></p>
  <button class="btn pri" onclick="doLogin()">Entrar</button></div></div>`;
}
async function doLogin() {
  const pin = $('#pin').value.trim();
  if (!F.uid) { $('#lerr').textContent = 'Elige tu nombre.'; return; }
  if (!/^\d{4,8}$/.test(pin)) { $('#lerr').textContent = 'Escribe tu PIN.'; return; }
  try {
    S.u = await api('login', F.uid, pin);
    S.recordar = $('#recordar').checked;
    if (S.recordar) store.set(S.u); else store.clear();
    await refreshInit(); S.mes = S.init.mes; showNav(); go('inicio');
  } catch (e) { $('#lerr').textContent = msg(e); }
}
function salir() { store.clear(); S.u = null; showLogin(); }

// ============ Navegación ============
function showNav() {
  $('#nav').style.display = 'flex';
  $('#nav').innerHTML = [['inicio', 'ti-home', 'Inicio'], ['movs', 'ti-list', 'Registros'], ['reg', 'ti-plus', ''],
    ['procs', 'ti-heart-rate-monitor', 'Procedim.'], ['mas', 'ti-dots', 'Más']]
    .map(x => `<div data-v="${x[0]}" class="${x[0] === 'reg' ? 'plus' : ''}" onclick="${x[0] === 'reg' ? "nuevoReg('ingreso')" : "go('" + x[0] + "')"}"><i class="ti ${x[1]}"></i>${x[2]}</div>`).join('');
}
const VIEWS = {};
function go(v, p) {
  S.view = v; S.param = p; closeModal();
  document.querySelectorAll('#nav div').forEach(d => d.classList.toggle('on', d.dataset.v === v || (v === 'proc' && d.dataset.v === 'procs')));
  window.scrollTo(0, 0);
  VIEWS[v](p);
}

// ============ INICIO ============
VIEWS.inicio = async () => {
  loading();
  let r;
  try { r = await api('resumen', auth(), S.mes); } catch (e) { return fail(e); }
  const c = r.consultorio, p = r.procedimientos, pc = pct(c.neto, c.meta);
  const prox = r.pres.filter(x => x.estado === 'proximo' || x.estado === 'vencido');
  $('#app').innerHTML = mnav() + `
  <div class="card tap" onclick="go('pres')">
    <p class="mid"><i class="ti ti-stethoscope"></i> Consultorio</p>
    <p class="lb">Debe cubrir el presupuesto general</p>
    <div class="row"><span>Ingresos</span><b class="g">${money(c.ingresos)}</b></div>
    ${c.patologia ? `<div class="row"><span>Patología</span><span class="r">− ${money(c.patologia)}</span></div>` : ''}
    ${c.transferido ? `<div class="row"><span>Pasado desde procedimientos</span><span class="b">+ ${money(c.transferido)}</span></div>` : ''}
    <div class="row"><span>Neto vs. meta</span><b>${money(c.neto)} <span class="muted small">de ${money(c.meta)}</span></b></div>
    ${bar(pc, pc >= 100 ? '#639922' : '#378ADD')}
    <p class="small ${c.faltante > 0 ? 'a' : 'g'}" style="margin:0">${pc}% · ${c.faltante > 0 ? 'faltan ' + money(c.faltante) + (r.dias ? ' · quedan ' + r.dias + ' días' : '') : 'meta cubierta'}</p>
    <div class="grid2" style="margin-top:10px">
      <div class="tile"><p class="lb">Pagado del presupuesto</p><b class="g">${money(c.presPagado)}</b></div>
      <div class="tile"><p class="lb">Por pagar</p><b class="a">${money(c.porPagar)}</b></div>
    </div>
  </div>
  <div class="card tap" onclick="go('procs')">
    <p class="mid"><i class="ti ti-heart-rate-monitor"></i> Procedimientos</p>
    <p class="lb">Cada uno con su presupuesto propio</p>
    <div class="row"><span>Cobrado</span><b>${money(p.ingresos)}</b></div>
    <div class="row"><span>Gastos y patología</span><span class="r">− ${money(p.gastos + p.patologia)}</span></div>
    ${p.transferido ? `<div class="row"><span>Pasado a consultorio</span><span class="b">− ${money(p.transferido)}</span></div>` : ''}
    <div class="row"><b>Ganancia</b><b class="g">${money(p.ganancia)}</b></div>
  </div>
  <div class="card center" style="background:#F1EFE8">
    <p class="lb">Total general del mes</p>
    <p class="big">${money(r.total.ingresos)}</p>
    <p class="small muted" style="margin:4px 0 0">Egresos ${money(r.total.egresos)} · Disponible <b class="${r.total.disponible >= 0 ? 'g' : 'r'}">${money(r.total.disponible)}</b></p>
  </div>
  <div class="grid2" style="margin-bottom:12px">
    <button class="btn gr" style="margin:0" onclick="nuevoReg('ingreso')"><i class="ti ti-plus"></i> Ingreso</button>
    <button class="btn rd" style="margin:0" onclick="nuevoReg('gasto')"><i class="ti ti-minus"></i> Gasto</button>
  </div>
  ${prox.length ? `<div class="card"><p class="mid"><i class="ti ti-bell"></i> Pagos que vencen</p>${prox.map(x => `
    <div class="row tap" onclick="nuevoReg('gasto',{pres:'${x.id}'})"><div class="day">${x.dia}</div><div class="t"><p>${esc(x.concepto)}</p>
    <p class="small ${x.estado === 'vencido' ? 'r' : 'a'}">${x.estado === 'vencido' ? 'Vencido' : 'Vence pronto'}</p></div><b>${money(x.monto)}</b></div>`).join('')}</div>` : ''}
  ${r.porCobrar.length ? `<div class="card"><p class="mid"><i class="ti ti-hourglass"></i> Por cobrar · ${money(r.totalPorCobrar)}</p>${r.porCobrar.map(x => `
    <div class="row"><div class="t tap" onclick="go('proc','${x.id}')"><p>${esc(x.nombre)} · ${esc(x.tipo)}</p><p class="small muted">Saldo ${money(x.saldo)}</p></div>
    <a href="${wa(x.celular, 'Hola ' + x.nombre.split(' ')[0] + ', le saludamos del consultorio del Dr. Villamizar. Le recordamos su saldo pendiente de ' + money(x.saldo) + ' por ' + x.tipo + '.')}" target="_blank" style="color:#25D366;font-size:24px"><i class="ti ti-brand-whatsapp"></i></a></div>`).join('')}</div>` : ''}
  ${r.porFacturar && r.porFacturar.n ? `<div class="card tap" onclick="go('porfac')"><div class="row"><span><i class="ti ti-file-invoice"></i> Pagos pendientes de procedimientos (${r.porFacturar.n})</span><b class="a">~${money(r.porFacturar.total)}</b></div></div>` : ''}
  ${r.patPend ? `<div class="card tap" onclick="go('pat')"><div class="row"><span><i class="ti ti-microscope"></i> Por pagar a Patología</span><b class="a">${money(r.patPend)}</b></div></div>` : ''}`;
};
function fail(e) { $('#app').innerHTML = `<p class="err">${esc(msg(e))}</p><button class="btn" onclick="go(S.view,S.param)">Reintentar</button>`; if (/PIN|ingresar/i.test(msg(e))) salir(); }

// ============ REGISTRAR ============
function nuevoReg(modo, pre) {
  pre = pre || {};
  F = { modo, cat: pre.proc ? 'Procedimientos' : '', item: null, proc: pre.proc || '', monto: '', forma: '', paciente: '', biopsia: false,
    nota: '', q: '', destino: pre.destino || (pre.proc && modo === 'gasto' ? 'procedimiento' : 'consultorio'), pres: pre.pres || '',
    concepto: '', bio: !!pre.bio, err: '' };
  if (modo === 'ingreso' && pre.proc) { const p = procById(pre.proc); if (p) F.monto = p.saldo; }
  if (modo === 'gasto' && pre.pres) { const l = S.init.pres.find(x => x.id === pre.pres); if (l) F.monto = Math.max(0, l.monto - l.pagado) || l.monto; }
  go('reg');
}
const procById = id => S.init.procs.find(p => p.id === id);
VIEWS.reg = () => vReg();

function vReg() {
  const ing = F.modo === 'ingreso';
  let h = `<h1>${ing ? 'Registrar ingreso' : 'Registrar gasto'}</h1>` +
    seg([{ t: 'Ingreso', on: ing, c: 'g', fn: "setModo('ingreso')" }, { t: 'Gasto', on: !ing, c: 'r', fn: "setModo('gasto')" }]);
  h += ing ? regIngreso() : regGasto();
  $('#app').innerHTML = h;
}
function setModo(m) { nuevoReg(m); }

function regIngreso() {
  const I = S.init, serv = I.cat.filter(c => c.tipo === 'servicio');
  const cats = [...new Set(serv.map(c => c.categoria))];
  let h = '';
  const elegido = F.item || F.proc;
  if (!elegido) {
    h += `<input placeholder="Buscar servicio…" value="${esc(F.q)}" oninput="F.q=this.value;$('#lista').innerHTML=listaIng()">`;
    const top = I.top.map(n => serv.find(c => c.servicio === n)).filter(Boolean);
    if (top.length) h += `<p class="lb">Más usados</p>` + top.map(c => chip(c.servicio, false, `selItem('${c.id}')`)).join('');
    h += `<p class="lb" style="margin-top:4px">Categoría</p>` + cats.map(c => chip(c, F.cat === c, `F.cat='${c}';F.q='';vReg()`)).join('') +
      chip('Procedimientos', F.cat === 'Procedimientos', "F.cat='Procedimientos';F.q='';vReg()");
    h += `<div id="lista" class="card" style="padding:4px 14px">${listaIng()}</div>`;
    return h;
  }
  // Formulario con el servicio elegido
  if (F.item) {
    h += `<div class="card"><p class="lb">Concepto</p><div class="row"><b class="t">${esc(F.item.servicio)}</b><span class="chip" onclick="F.item=null;vReg()">Cambiar</span></div></div>`;
  } else {
    const p = procById(F.proc);
    h += `<div class="card"><p class="lb">Abono a procedimiento</p><div class="row"><div class="t"><b>${esc(p.tipo)} · ${esc(p.nombre)}</b>
      <p class="small muted">Cobrado ${money(p.cobrado)} de ${money(p.precio)} · saldo <b class="a">${money(p.saldo)}</b></p></div>
      <span class="chip" onclick="F.proc='';vReg()">Cambiar</span></div></div>`;
  }
  h += `<p class="lb">Monto${F.item ? ' (precio de lista, puedes cambiarlo)' : ''}</p>
    <input class="monto" type="number" inputmode="decimal" value="${esc(F.monto)}" oninput="F.monto=this.value;prevIng()">`;
  if (F.item && F.item.biopsia) {
    h += `<p class="lb">¿Se tomó biopsia de cuello uterino?</p>` +
      seg([{ t: 'No', on: !F.biopsia, fn: 'F.biopsia=false;vReg()' }, { t: 'Sí', on: F.biopsia, fn: 'F.biopsia=true;vReg()' }]);
  }
  h += `<p class="lb">Forma de pago</p>` + S.init.formas.map(f => chip(f, F.forma === f, `F.forma='${f}';vReg()`)).join('');

function totG(ref) { const el = $('#tot' + ref); if (el) el.textContent = money(totGastos(ref === 'F' ? F.gastos : P.rows)); }
function vProc() {

  <p class="lb">Forma de pago de los gastos marcados</p>${S.init.formas.map(f => chip(f, F.formaG === f, `F.formaG='${f}';vProc()`)).join('')}
  ${tablaGastos(F.gastos, 'F', 'vProc()', F.fecha_proc, true)}` : ''}

async function buscarPac() {
  const n = F.num_doc.trim();
  if (n.length < 6) return;
  try {
    const p = await api('buscarPaciente', auth(), n);
    if (p) { Object.assign(F, { tipo_doc: p.tipo_doc, nombres: p.nombres, apellidos: p.apellidos, celular: p.celular, conocida: true }); vProc(); }
    else if (F.conocida) { F.conocida = false; vProc(); }
  } catch (e) {}
}
function valPac() {
  const n = F.num_doc.trim().toUpperCase(), cel = F.celular.replace(/[\s-]/g, '');
  if (!F.cat_id) return 'Elige el tipo de procedimiento.';
  const tc = S.init.cat.find(c => c.id === F.cat_id);
  if (tc && tc.detalle && !F.detalle.trim()) return 'Especifica la cirugía o el procedimiento.';
  if (F.tipo_doc === 'DNI' && !/^\d{8}$/.test(n)) return 'El DNI debe tener 8 dígitos.';
  if (F.tipo_doc === 'CE' && !/^[A-Z0-9]{9,12}$/.test(n)) return 'El carnet de extranjería debe tener al menos 9 caracteres.';
  if (F.tipo_doc === 'PAS' && !/^[A-Z0-9]{6,12}$/.test(n)) return 'El pasaporte debe tener entre 6 y 12 letras o números.';
  if (!F.nombres.trim() || !F.apellidos.trim()) return 'Escribe nombres y apellidos.';
  if (cel.charAt(0) === '+' ? !/^\+\d{8,15}$/.test(cel) : !/^9\d{8}$/.test(cel)) return 'El celular debe tener 9 dígitos y empezar con 9 (o + y código de país).';
  if (!(Number(F.precio) > 0)) return 'Ingresa el precio total.';
  if (Number(F.pago) > Number(F.precio)) return 'El pago no puede ser mayor al precio total.';
  if (Number(F.pago) > 0 && !F.forma) return 'Elige la forma de pago del cobro.';
  for (const g of F.gastos) {
    if (g.pagado && !String(g.concepto).trim()) return 'Escribe el concepto de cada gasto marcado como pagado.';
    if (g.pagado && !(Number(g.monto) > 0)) return 'Escribe el monto de "' + g.concepto + '" para marcarlo como pagado.';
    if (g.pagado && !(g.forma || F.formaG)) return 'Elige la forma de pago de los gastos marcados.';
    if (g.pagado && (g.fecha || F.fecha_proc) > S.init.hoy) return 'La fecha de pago de "' + g.concepto + '" no puede ser futura. Cámbiala con "cambiar".';
  }
  return '';
}
async function guardarProc() {
  if (busy) return;
  F.err = valPac();
  if (F.err) return vProc();
  busy = true; vProc();
  try {
    const payload = Object.assign({}, F, { gastos: F.gastos.filter(g => String(g.concepto).trim()).map(g => ({ concepto: g.concepto, monto: g.monto,
      pagado: g.pagado, forma: g.forma || F.formaG, fecha: g.fecha || F.fecha_proc, comp_tipo: g.ctipo, comp_num: g.cnum })) });
    const r = await api('crearProcedimiento', auth(), payload);
    busy = false; toast('Procedimiento guardado');
    await refreshInit(); go('proc', r.id);
  } catch (e) { busy = false; F.err = msg(e); vProc(); }
}

let P = { rows: [] };
function vPend() {
  const el = $('#pend'); if (!el) return;
  if (!P.rows.length) { el.innerHTML = '<p class="small muted">No hay pagos pendientes.</p>'; return; }
  const marcados = P.rows.filter(r => r.pagado).length;
  el.innerHTML = `<p class="lb">Forma de pago de lo marcado</p>${S.init.formas.map(f => chip(f, P.formaG === f, `P.formaG='${f}';vPend()`)).join('')}
  ${tablaGastos(P.rows, 'P', 'vPend()', S.init.hoy, false)}
  ${P.err ? `<p class="err">${esc(P.err)}</p>` : ''}
  <button class="btn pri" ${busy ? 'disabled' : ''} onclick="guardarPend()">${marcados ? 'Guardar ' + marcados + (marcados === 1 ? ' pago' : ' pagos') : 'Guardar montos'}</button>`;
}
async function guardarPend() {
  if (busy) return;
  P.err = '';
  for (const g of P.rows) {
    if (g.pagado && !(Number(g.monto) > 0)) { P.err = 'Escribe el monto de "' + g.concepto + '".'; break; }
    if (g.pagado && !(g.forma || P.formaG)) { P.err = 'Elige la forma de pago.'; break; }
  }
  if (P.err) return vPend();
  const items = P.rows.filter(g => g.pagado || String(g.monto) !== String(g.orig)).map(g => ({ id: g.id, monto: g.monto, pagado: g.pagado,
    forma: g.forma || P.formaG, fecha: g.fecha || S.init.hoy, comp_tipo: g.ctipo, comp_num: g.cnum }));
  if (!items.length) { P.err = 'Marca algún pago o cambia un monto.'; return vPend(); }
  busy = true; vPend();
  try {
    const r = await api('pagarPendientes', auth(), P.procId, items);
    busy = false; toast(r.pagados ? r.pagados + (r.pagados === 1 ? ' pago registrado' : ' pagos registrados') : 'Montos actualizados');
    await refreshInit(); go('proc', P.procId);
  } catch (e) { busy = false; P.err = msg(e); vPend(); }
}

  if (isAdmin()) { try { nc = (await api('correcciones', auth())).length; } catch (e) {} }
  const item = (ic, t, fn, extra) => `<div class="row tap" onclick="${fn}"><i class="ti ${ic}" style="font-size:22px"></i><span class="t">${t}</span>${extra || ''}<i class="ti ti-chevron-right muted"></i></div>`;
  $('#app').innerHTML = `<h1>Más</h1><p class="small muted" style="margin-top:-8px">${esc(S.u.nombre)} · ${isAdmin() ? 'Doctor (administrador)' : 'Asistente'}</p>
  <div class="card" style="padding:4px 14px">
  ${item('ti-calendar-dollar', 'Presupuesto general', "go('pres')")}
  ${item('ti-microscope', 'Patología', "go('pat')")}
  ${item('ti-file-text', 'Informe PDF y Excel', "go('inf')")}
  ${isAdmin() ? item('ti-message-exclamation', 'Correcciones pedidas', "go('corr')", nc ? `<span class="badge bd-r">${nc}</span>` : '') : ''}
  ${isAdmin() ? item('ti-arrows-exchange', 'Pasar dinero de procedimientos al consultorio', 'transfer()') : ''}
  ${item('ti-key', 'Cambiar mi PIN', 'cambiarPin()')}
  </div>
  <button class="btn" onclick="salir()"><i class="ti ti-logout"></i> Cerrar sesión</button>`;
};
async function transfer() {
  let r; try { r = await api('resumen', auth(), S.init.mes); } catch (e) { return toast(msg(e), true); }
  modal(`<h2>Pasar dinero al consultorio</h2>
  <p class="small muted">Faltante del consultorio este mes: <b class="a">${money(r.consultorio.faltante)}</b><br>Ganancia de procedimientos: <b class="g">${money(r.procedimientos.ganancia)}</b></p>
  <p class="lb">Monto</p><input id="tmon" type="number" inputmode="decimal" class="monto" value="${r.consultorio.faltante || ''}">
  <p class="lb">Nota (opcional)</p><input id="tnot"><p class="err" id="terr"></p>
  <button class="btn pri" onclick="doTransfer()">Pasar dinero</button><button class="btn" onclick="closeModal()">Cancelar</button>`);
}
async function doTransfer() {
  const m = Number($('#tmon').value);
  if (!(m > 0)) { $('#terr').textContent = 'Ingresa un monto mayor a 0.'; return; }
  try { await api('transferir', auth(), m, $('#tnot').value); closeModal(); toast('Dinero pasado al consultorio'); go('inicio'); } catch (e) { $('#terr').textContent = msg(e); }
}

function cambiarPin() {
  modal(`<h2>Cambiar mi PIN</h2>
  <p class="lb">PIN actual</p><input id="p0" type="password" inputmode="numeric" maxlength="6">
  <p class="lb">PIN nuevo (6 números)</p><input id="p1" type="password" inputmode="numeric" maxlength="6">
  <p class="lb">Repite el PIN nuevo</p><input id="p2" type="password" inputmode="numeric" maxlength="6">
  <p class="err" id="perr"></p>
  <button class="btn pri" onclick="doCambiarPin()">Guardar PIN</button><button class="btn" onclick="closeModal()">Cancelar</button>`);
}
async function doCambiarPin() {
  const p0 = $('#p0').value.trim(), p1 = $('#p1').value.trim(), p2 = $('#p2').value.trim();
  if (!p0) return $('#perr').textContent = 'Escribe tu PIN actual.';
  if (!/^\d{6}$/.test(p1)) return $('#perr').textContent = 'El PIN nuevo debe tener 6 números.';
  if (p1 !== p2) return $('#perr').textContent = 'Los dos PIN nuevos no coinciden.';
  try {
    const r = await api('cambiarPin', auth(), p0, p1);
    S.u.pin = r.pin;
    if (S.recordar !== false) store.set(S.u);
    closeModal(); toast('PIN cambiado');
  } catch (e) { $('#perr').textContent = msg(e); }
}

// ============ CORRECCIONES ============
VIEWS.corr = async () => {
  loading();
  let l;
  try { l = await api('correcciones', auth()); } catch (e) { return fail(e); }
  $('#app').innerHTML = `<p class="small tap b" onclick="go('mas')"><i class="ti ti-arrow-left"></i> Más</p><h1>Correcciones pedidas</h1>
  ${l.length ? l.map(c => `<div class="card"><p class="small muted" style="margin:0">${esc(c.fecha)} · ${esc(c.usuario)}</p>
    <p style="margin:6px 0"><b>${esc(c.detalle)}</b></p><p style="margin:0 0 10px">“${esc(c.motivo)}”</p>
    <button class="btn sm rd" onclick="resolver('${c.id}',true)">Anular registro</button><button class="btn sm" onclick="resolver('${c.id}',false)">Marcar resuelta</button></div>`).join('')
    : '<p class="muted center">No hay correcciones pendientes.</p>'}
  <p class="small muted center">Después de anular, vuelve a registrar el dato correcto.</p>`;
};
async function resolver(id, an) { try { await api('resolverCorreccion', auth(), id, an); toast(an ? 'Registro anulado' : 'Resuelta'); await refreshInit(); go('corr'); } catch (e) { toast(msg(e), true); } }

// ============ INFORME ============
VIEWS.inf = () => {
  $('#app').innerHTML = mnav() + `<h1>Informe del mes</h1>
  <div class="card"><p class="small muted" style="margin-top:0">Incluye resumen, consultorio vs. presupuesto, procedimientos, Patología y el detalle de cada registro.</p>
  <button class="btn pri" id="bpdf" onclick="descargar('informePDF','bpdf')"><i class="ti ti-file-type-pdf"></i> Descargar PDF</button>
  <button class="btn" id="bxls" onclick="descargar('informeExcel','bxls')"><i class="ti ti-file-spreadsheet"></i> Descargar Excel</button></div>`;
};
async function descargar(fn, bid) {
  const b = $('#' + bid), txt = b.innerHTML;
  b.disabled = true; b.textContent = 'Generando…';
  try {
    const r = await api(fn, auth(), S.mes);
    const bin = atob(r.b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
    const a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
    toast('Informe listo');
  } catch (e) { toast(msg(e), true); }
  b.disabled = false; b.innerHTML = txt;
}

start();
</script>
</body>
</html>
